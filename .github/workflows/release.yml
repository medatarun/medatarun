name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Ensure tag is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "${GITHUB_REF_NAME}" origin/main

      - name: Set up JDK
        uses: actions/setup-java@v6.2.0
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Build distribution
        run: ./gradlew build

      # Everything that can be checked without publishing runs before the first publication.
      # A publication cannot be undone, and GitHub Packages refuses to publish an existing version again.

      # The pnpm version comes from the "packageManager" field of ui/package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          package_json_file: ui/package.json

      # Same Node version as the frontend Gradle plugin (ui/build.gradle.kts).
      # registry-url and scope write an .npmrc that reads the token from NODE_AUTH_TOKEN.
      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.15.0"
          registry-url: "https://npm.pkg.github.com"
          scope: "@medatarun"

      # Prepares the npm package @medatarun/ui and checks it with a dry run.
      # The version comes from the tag. It is only written in the workspace, never committed.
      # Pre-releases get the "next" dist-tag, so "latest" always points to a stable version.
      # --no-git-checks is required: the tag checkout is a detached HEAD and package.json is modified.
      - name: Check frontend package
        working-directory: ui
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dist_tag="latest"
          case "${VERSION}" in
            *-alpha*|*-beta*|*-rc*) dist_tag="next" ;;
          esac
          echo "NPM_DIST_TAG=${dist_tag}" >> "${GITHUB_ENV}"
          pnpm pkg set version="${VERSION}"
          pnpm publish --dry-run --tag "${dist_tag}" --no-git-checks

      # The GitHub release attaches this archive. Checked here so that a missing archive
      # stops the workflow before any publication.
      - name: Check distribution archive
        run: test -f "app/build/distributions/medatarun-${GITHUB_REF_NAME#v}.zip"

      # Publishes all JVM modules to GitHub Packages. The version comes from the tag (GITHUB_REF_NAME).
      # Credentials come from the workflow token, nothing is stored in the repository.
      - name: Publish modules to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew publish

      # Publishes the frontend sources prepared and checked above.
      - name: Publish frontend package to GitHub Packages
        working-directory: ui
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm publish --tag "${NPM_DIST_TAG}" --no-git-checks

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          prerelease_flag=""
          case "${VERSION}" in
            *-alpha*|*-beta*|*-rc*) prerelease_flag="--prerelease" ;;
          esac
          gh release create "${GITHUB_REF_NAME}" "app/build/distributions/medatarun-${VERSION}.zip" --title "v${VERSION}" ${prerelease_flag}
